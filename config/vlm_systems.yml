# Prompted-VLM systems for the §8.6 calibration pass.
#
# The other arm of the pass — Docling and MinerU — cannot be told the
# convention, so it measures whether the convention is idiomatic Markdown at
# all. The systems here read config/prompt.md, so they measure whether the
# convention is *communicable*. Both arms write runs/<system>/<stem>.md and are
# scored by the same command.
#
# Every key is required for every system, including the no-op: a local system
# still writes `base_url: none`. Reading this file alone must answer what each
# system is and how it is reached.
#
# The system name is the runs/ subdirectory and the label `score` reports, so
# it must name the checkpoint actually run. Do not run one checkpoint under
# another's name.
#
#   transport: local_mlx    on-device MLX checkpoint via mlx-vlm. Run it in an
#                           env whose mlx-vlm knows the architecture —
#                           docparse-docling carries 0.6.4, which has gemma4;
#                           docparse-mineru's 0.3.9 does not.
#              openai_http  an OpenAI-compatible server (vLLM, SGLang, ...).
#
# temperature 0.0 and top_p 1.0 make a run reproducible. A benchmark that
# cannot be re-run to the same numbers cannot attribute a change to a policy
# edit, so raise them only deliberately.

systems:
  # Runs here, on the M1. NOT the checkpoint spec §8.6 names — this is the E4B
  # (mlx-community/gemma-4-E4B-it-qat-4bit), a much smaller model than the 12B
  # below, and it is declared separately so its scores are never read as the
  # 12B's. It is a local proxy for "can a prompted model follow prompt.md at
  # all", available without the remote host.
  gemma-4-E4B-it-qat-4bit:
    transport: local_mlx
    model: /Users/tod/PretrainedLLM/gemma-4-E4B-it-qat-4bit
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 600
    # This checkpoint's audio tower is transposed against mlx-vlm 0.6.4 — 14
    # weights in the subsample and depthwise convs, e.g. (128, 3, 3, 1) in the
    # checkpoint against (128, 3, 1, 3) in the library. Verified 2026-08-18
    # that the mismatch is confined to audio_tower: the vision and language
    # towers match exactly, and no checkpoint key is absent from the model.
    # This is image-text-to-text, so that tower is never invoked.
    #
    # Naming a tower here loads the checkpoint non-strictly, and the runner
    # then proves the mismatch stayed inside the named towers — a vision
    # mismatch aborts rather than transcribing from uninitialised weights.
    # Leave it [] for any system whose checkpoint matches its library.
    mlx_unused_towers: [audio_tower]
    image_first: true
    # 1.0 is off. Raising it is tempting for the bank statements that run to the
    # token cap, but these pages legitimately repeat tokens — dates, EFTPOS,
    # amounts, column headers — so a penalty degrades exactly the transcription
    # it is meant to rescue. Change it only against a captured _truncated/ page
    # showing what is actually being repeated.
    repetition_penalty: 1.0
    vllm_engine: none

  # A local MLX 4-bit QAT conversion of the same base model as the entry below,
  # NOT that entry's checkpoint: w4a16-ct is compressed-tensors, a vLLM/GPU
  # format mlx-vlm cannot load, so running "the 12B" here means a differently
  # quantised artifact (mlx-community/gemma-4-12B-it-qat-OptiQ-4bit). Same
  # weights, different quantiser — comparable, not interchangeable, which is
  # why it carries its own name and its own row in any report.
  #
  # 9.0 GB against E4B's 6.8 GB, on a 16 GB machine. Measure before trusting a
  # full run: memory pressure, not accuracy, is what decides whether this is
  # usable here.
  gemma-4-12B-it-qat-OptiQ-4bit:
    transport: local_mlx
    model: /Users/tod/PretrainedLLM/gemma-4-12B-it-qat-OptiQ-4bit
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 900
    mlx_unused_towers: []
    image_first: true
    # 1.0 is off. Raising it is tempting for the bank statements that run to the
    # token cap, but these pages legitimately repeat tokens — dates, EFTPOS,
    # amounts, column headers — so a penalty degrades exactly the transcription
    # it is meant to rescue. Change it only against a captured _truncated/ page
    # showing what is actually being repeated.
    repetition_penalty: 1.0
    vllm_engine: none

  # Spec §8.6. 4-bit QAT, so character-level slips here are a quantisation
  # signal rather than a convention one. Served from the remote GPU host.
  gemma-4-12B-it-qat-w4a16-ct:
    # In-process vLLM engine, not a served endpoint: the sandbox that holds this
    # checkpoint drives vLLM through its offline Python API, so there is no
    # OpenAI-compatible URL to call. Run this on the GPU host itself, in an env
    # with vLLM >= 0.23.0 (the floor for gemma4_unified).
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/gemma-4-12B-it-qat-w4a16-ct
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 600
    mlx_unused_towers: []
    image_first: true
    # Measured values from the LMM_POC sandbox, not guesses. Engine tuning
    # decides what the model can SEE, so a wrong value here produces a run that
    # completes and is quietly worse.
    vllm_engine:
      # tp=1 means ONE WHOLE ENGINE PER GPU, not one GPU. 9.56 GiB fits a card
      # whole, so the sandbox runs 2xL4 as two engines (tp=1 each) rather than
      # sharding one engine tp=2 across PCIe. A whole replica per card is the
      # better arrangement when the weights fit one: no all-reduce per layer
      # over an interconnect these cards do not have, and a dead card costs one
      # replica rather than a serving unit.
      #
      # Use both cards by running one process per GPU over disjoint pages:
      #   CUDA_VISIBLE_DEVICES=0 python -m runners.run_vlm ... --shard 0 --shards 2 &
      #   CUDA_VISIBLE_DEVICES=1 python -m runners.run_vlm ... --shard 1 --shards 2 &
      # Both write to the same --out; the resume logic keeps them disjoint.
      # Running with --shards 1 uses ONE card and leaves the other idle.
      tensor_parallel_size: 1
      max_model_len: 16384
      gpu_memory_utilization: 0.90
      max_num_seqs: 10
      # One whole image; Gemma pan-and-scans internally.
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      # The vision budget, and the single most consequential value here. 1120
      # and 280 were BOTH measured on this checkpoint and both regressed
      # (median F1 0.953 -> 0.369 at 1120; 0.915 -> 0.882 at 280). 560 is the
      # value to beat, not a starting point. Written once and applied to both
      # mm_processor_kwargs.max_soft_tokens and
      # hf_overrides.vision_config.num_soft_tokens, which must agree — one
      # value makes disagreement unrepresentable rather than merely tested.
      soft_tokens: 560
      # This checkpoint's own tokenizer is correct; see InternVL below for the
      # case where it is not.
      tokenizer: none
    # See the note above: 1.0 is off, and this corpus is repetitive by nature.
    repetition_penalty: 1.0

  # Spec §8.6. A second VLM family rather than a second Gemma, because the pass
  # is looking for convention disagreement, not a leaderboard.
  InternVL3.5-8B:
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/InternVL3_5-8B
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 600
    mlx_unused_towers: []
    image_first: true
    repetition_penalty: 1.0
    vllm_engine:
      tensor_parallel_size: 1
      max_model_len: 16384
      gpu_memory_utilization: 0.90
      max_num_seqs: 10
      # One whole image. The LMM_POC sandbox sets 19 because its pipeline
      # PRE-TILES: it crops the page into 18 tiles plus a thumbnail and hands
      # vLLM each as a separate image, so the limit must admit them all. This
      # runner sends the page whole and lets InternVL tile it internally, which
      # vLLM counts as one image. If dense statements read poorly, pre-tiling is
      # the first thing to try — it is why that sandbox does it.
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      # A gemma4_unified knob; this architecture has no equivalent.
      soft_tokens: none
      # REQUIRED for this checkpoint, and not a tuning choice. InternVL3.5 ships
      # a Mistral tokenizer whose pre-tokenizer regex mis-splits runs of
      # whitespace and digits — which is exactly what a whitespace-aligned,
      # digit-heavy bank statement is made of, so it corrupts amount
      # tokenization. vLLM exposes no flag for it and loads the tokenizer in the
      # front-end AND in every spawned EngineCore child, so a load-time patch
      # cannot reach the children; the fix has to be a corrected copy on disk.
      #
      # Produce it with LMM_POC's ensure_corrected_tokenizer(), which writes a
      # fix_mistral_regex-corrected copy to
      # ~/.cache/lmm_poc_tokenizers/<model-name>, then point this at it.
      # Running without it scores a tokenizer bug as the model misreading, on
      # the amount columns this corpus is largely made of.
      tokenizer: /home/jovyan/.cache/lmm_poc_tokenizers/InternVL3_5-8B

  # ---------------------------------------------------------------------------
  # THE DIGIT-FIDELITY CONTROLS. Two of them, and the pair is the experiment.
  #
  # The question. Numeric fidelity over 165 pages puts gemma-4-12B-it-qat-w4a16-ct
  # at 92.5% of amounts correct against MinerU's 100.0%, with misses that are
  # digit SUBSTITUTIONS rather than dropped lines — on a model that leads every
  # other metric in this pass. Quantisation costing character fidelity first is
  # the standing explanation and had never been measured here.
  #
  # One control cannot answer it, because the 4-bit checkpoint differs from a
  # plain BF16 model in two ways at once: precision AND quantisation-aware
  # training. Three systems and three pairwise comparisons separate them:
  #
  #   w4a16-ct  vs  qat-q4_0-unquantized   ->  precision alone (QAT held fixed)
  #   w4a16-ct  vs  gemma-4-12B-it         ->  precision + QAT training
  #   unquantized vs gemma-4-12B-it        ->  QAT training alone (BF16 both)
  #
  # On "qat...unquantized", which reads like a contradiction and is not one.
  # QAT is a TRAINING method: fake-quantisation ops sit in the forward pass so
  # the model learns weights that survive being quantised, while the master
  # weights stay high-precision throughout. What comes out of QAT is a BF16
  # checkpoint; quantising it to 4 bits is a separate later step. Google
  # publishes both halves — `-qat-q4_0` at 4 bits and `-qat-q4_0-unquantized` at
  # BF16 — where `q4_0` names the quantisation the training was aware of and
  # `unquantized` says this distribution has not had it applied. Its model card
  # calls it "half-precision weights extracted from the QAT pipeline".
  #
  # Both are ~24 GB at BF16 and need a 48 GB card: neither fits an L4 beside a
  # KV cache. One L40S, one engine, no --shards, one after the other.
  # ---------------------------------------------------------------------------

  # Control 3, and it asks a different question from the other two. Those
  # measured what PRECISION costs at 12B: 4-bit -> BF16 buys +4.1 points of
  # bank-statement amount accuracy (90.3% -> 94.4%), while QAT training buys
  # +0.1. That leaves 5.5 points between the best gemma and MinerU's 100.0%
  # which is neither precision nor QAT.
  #
  # This tests whether that residue is CAPACITY. Same 4-bit w4a16-ct format as
  # the 12B, so quantisation is held fixed and parameter count is the variable:
  #
  #   31B@4-bit near 100%  ->  4-bit is not the binding constraint at all, the
  #                            12B's deficit is size, and the finding is about
  #                            model capacity rather than quantisation.
  #   31B@4-bit near  90%  ->  the deficit tracks the quantisation, not the
  #                            parameter count, and scaling will not fix it.
  #
  # ~18-20 GB at 4 bits, so it fits the 48 GB L40S with room for the KV cache.
  # Its BF16 counterpart is ~62 GB and does NOT fit, so precision cannot be
  # isolated within the 31B on this hardware the way it was for the 12B.
  gemma-4-31B-it-qat-w4a16-ct:
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/gemma-4-31B-it-qat-w4a16-ct
    base_url: none
    base_url_env: none
    api_key_env: none
    # Identical decoding to every other gemma run in this pass.
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 900
    mlx_unused_towers: []
    image_first: true
    repetition_penalty: 1.0
    vllm_engine:
      tensor_parallel_size: 1
      max_model_len: 16384
      gpu_memory_utilization: 0.90
      max_num_seqs: 10
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      # Held at the 12B's measured value. soft_tokens is the vision budget, and
      # varying it here would confound capacity with what the model can see —
      # which is the one thing this run exists to separate.
      soft_tokens: 560
      tokenizer: none

  # ---------------------------------------------------------------------------
  # DEPLOYMENT PROBES: does the 31B fit a 24 GB card?
  #
  # The 31B is the best system in this study by a wide margin. Its weights are
  # 22 GB at 4 bits (measured, not estimated) — barely under the BF16 12B's
  # 23 GB, because the embedding and vision tensors stay at higher precision and
  # Gemma's vocabulary is large. Production here is a multi-A10G or multi-L4
  # cluster — 24 GB cards — so the question is not whether it runs but whether
  # ONE CARD HOLDS A WHOLE REPLICA. That decides the deployment shape:
  #
  #   fits one card    -> scale by replicas. No NCCL, no interconnect
  #                       requirement, a dead card costs one replica.
  #   does not fit     -> every request must be sharded across cards, which on
  #                       NVLink-less L4s means tensor parallel over PCIe.
  #
  # Same checkpoint as gemma-4-31B-it-qat-w4a16-ct; only the engine differs, and
  # the names say which deployment each is. Keep their predictions out of the
  # scored comparison: a shorter max_model_len can truncate where the declared
  # configuration would not, so they answer a capacity question, not an accuracy
  # one.
  # ---------------------------------------------------------------------------

  # Probe 1: one whole replica on one L4. max_model_len is the binding
  # constraint, not the weights — ~18 GB of weights on a 24 GB card leaves a few
  # GB for the KV cache, and the cache scales with max_model_len x max_num_seqs.
  #
  # 12288 is a floor, not a preference. A page needs 560 image tokens plus ~1000
  # of prompt plus up to max_output_tokens (8192) of transcription; drop below
  # about 10k and long bank statements start truncating, which would score as
  # the model failing rather than the card being too small.
  gemma-4-31B-it-qat-w4a16-ct-1xL4:
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/gemma-4-31B-it-qat-w4a16-ct
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 900
    mlx_unused_towers: []
    image_first: true
    repetition_penalty: 1.0
    vllm_engine:
      tensor_parallel_size: 1
      max_model_len: 12288
      # 0.95 rather than 0.90: this probe is asking whether the card can be made
      # to hold a replica at all, so it should not fail for want of the last
      # 5% it is allowed to use.
      gpu_memory_utilization: 0.95
      # One sequence at a time. Concurrency multiplies the KV cache, and the
      # question here is the floor, not the throughput.
      max_num_seqs: 1
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      soft_tokens: 560
      tokenizer: none

  # Probe 2: one engine sharded across both L4s. Halves the weights per card and
  # buys real KV headroom, at the cost of an all-reduce on every layer over PCIe
  # — no NVLink on these cards, so the all-reduce crosses PCIe on every layer.
  # The probe asks whether the memory works and what it costs in throughput.
  #
  # DEPLOYMENT NOTE, and it applies to PROD rather than to this sandbox. vLLM's
  # tensor-parallel path communicates through shared memory, and an undersized
  # /dev/shm makes it hang rather than fail — a deadlock with no error, which
  # reads as a wedged model. PROD hit exactly that and it was resolved by
  # raising the shared-memory limit. The sandbox is sized adequately and has
  # never shown it.
  #
  # This is not incidental here: the 31B does not fit a 24 GB card, so on an
  # A10G or L4 cluster it MUST run tensor-parallel. Size /dev/shm before
  # deploying it, or the first thing that happens is a hang with nothing in the
  # logs. Containers commonly default to 64 MB; vLLM wants gigabytes
  # (`--shm-size` on Docker, `emptyDir: {medium: Memory}` on Kubernetes).
  gemma-4-31B-it-qat-w4a16-ct-2xL4-tp2:
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/gemma-4-31B-it-qat-w4a16-ct
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 900
    mlx_unused_towers: []
    image_first: true
    repetition_penalty: 1.0
    vllm_engine:
      tensor_parallel_size: 2
      # The declared length, since sharding should afford it.
      max_model_len: 16384
      gpu_memory_utilization: 0.90
      max_num_seqs: 10
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      soft_tokens: 560
      tokenizer: none

  # Control 1: the same QAT weights as the 4-bit checkpoint, at BF16. Precision
  # is the ONLY variable against w4a16-ct, which makes this the clean control
  # and the one to quote.
  gemma-4-12B-it-qat-q4_0-unquantized:
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/gemma-4-12B-it-qat-q4_0-unquantized
    base_url: none
    base_url_env: none
    api_key_env: none
    # Identical decoding to the 4-bit run. A control that changes two things
    # measures neither.
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 600
    mlx_unused_towers: []
    image_first: true
    repetition_penalty: 1.0
    vllm_engine:
      tensor_parallel_size: 1
      max_model_len: 16384
      gpu_memory_utilization: 0.90
      max_num_seqs: 10
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      # Must match the 4-bit run exactly. soft_tokens is the vision budget, and
      # 1120 and 280 were both measured on this checkpoint family and both
      # regressed; changing it here would confound precision with what the model
      # can see.
      soft_tokens: 560
      tokenizer: none

  # Control 2: the plain BF16 instruct model — no QAT. Against control 1 it
  # isolates what quantisation-aware training does on its own, both being BF16.
  gemma-4-12B-it:
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/gemma-4-12B-it
    base_url: none
    base_url_env: none
    api_key_env: none
    # Identical decoding to the 4-bit run. A control that changes two things
    # measures neither.
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 600
    mlx_unused_towers: []
    image_first: true
    repetition_penalty: 1.0
    vllm_engine:
      tensor_parallel_size: 1
      max_model_len: 16384
      # BF16 weights are ~24 GB of a 48 GB card, leaving room for the KV cache
      # at this utilisation. Lower it only if the engine fails to allocate.
      gpu_memory_utilization: 0.90
      max_num_seqs: 10
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      # Must match the 4-bit run exactly. soft_tokens is the vision budget, and
      # 1120 and 280 were both measured on this checkpoint family and both
      # regressed; changing it here would confound precision with what the model
      # can see.
      soft_tokens: 560
      tokenizer: none
