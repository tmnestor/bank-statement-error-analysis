# Prompted-VLM systems for the §8.6 calibration pass.
#
# The other arm of the pass — Docling and MinerU — cannot be told the
# convention, so it measures whether the convention is idiomatic Markdown at
# all. The systems here read config/prompt.md, so they measure whether the
# convention is *communicable*. Both arms write runs/<system>/<stem>.md and are
# scored by the same command.
#
# Every key is required for every system, including the no-op: a local system
# still writes `base_url: none`. Reading this file alone must answer what each
# system is and how it is reached.
#
# The system name is the runs/ subdirectory and the label `score` reports, so
# it must name the checkpoint actually run. Do not run one checkpoint under
# another's name.
#
#   transport: local_mlx    on-device MLX checkpoint via mlx-vlm. Run it in an
#                           env whose mlx-vlm knows the architecture —
#                           docparse-docling carries 0.6.4, which has gemma4;
#                           docparse-mineru's 0.3.9 does not.
#              openai_http  an OpenAI-compatible server (vLLM, SGLang, ...).
#
# temperature 0.0 and top_p 1.0 make a run reproducible. A benchmark that
# cannot be re-run to the same numbers cannot attribute a change to a policy
# edit, so raise them only deliberately.

systems:
  # Runs here, on the M1. NOT the checkpoint spec §8.6 names — this is the E4B
  # (mlx-community/gemma-4-E4B-it-qat-4bit), a much smaller model than the 12B
  # below, and it is declared separately so its scores are never read as the
  # 12B's. It is a local proxy for "can a prompted model follow prompt.md at
  # all", available without the remote host.
  gemma-4-E4B-it-qat-4bit:
    transport: local_mlx
    model: /Users/tod/PretrainedLLM/gemma-4-E4B-it-qat-4bit
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 600
    # This checkpoint's audio tower is transposed against mlx-vlm 0.6.4 — 14
    # weights in the subsample and depthwise convs, e.g. (128, 3, 3, 1) in the
    # checkpoint against (128, 3, 1, 3) in the library. Verified 2026-08-18
    # that the mismatch is confined to audio_tower: the vision and language
    # towers match exactly, and no checkpoint key is absent from the model.
    # This is image-text-to-text, so that tower is never invoked.
    #
    # Naming a tower here loads the checkpoint non-strictly, and the runner
    # then proves the mismatch stayed inside the named towers — a vision
    # mismatch aborts rather than transcribing from uninitialised weights.
    # Leave it [] for any system whose checkpoint matches its library.
    mlx_unused_towers: [audio_tower]
    image_first: true
    # 1.0 is off. Raising it is tempting for the bank statements that run to the
    # token cap, but these pages legitimately repeat tokens — dates, EFTPOS,
    # amounts, column headers — so a penalty degrades exactly the transcription
    # it is meant to rescue. Change it only against a captured _truncated/ page
    # showing what is actually being repeated.
    repetition_penalty: 1.0
    vllm_engine: none

  # A local MLX 4-bit QAT conversion of the same base model as the entry below,
  # NOT that entry's checkpoint: w4a16-ct is compressed-tensors, a vLLM/GPU
  # format mlx-vlm cannot load, so running "the 12B" here means a differently
  # quantised artifact (mlx-community/gemma-4-12B-it-qat-OptiQ-4bit). Same
  # weights, different quantiser — comparable, not interchangeable, which is
  # why it carries its own name and its own row in any report.
  #
  # 9.0 GB against E4B's 6.8 GB, on a 16 GB machine. Measure before trusting a
  # full run: memory pressure, not accuracy, is what decides whether this is
  # usable here.
  gemma-4-12B-it-qat-OptiQ-4bit:
    transport: local_mlx
    model: /Users/tod/PretrainedLLM/gemma-4-12B-it-qat-OptiQ-4bit
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 900
    mlx_unused_towers: []
    image_first: true
    # 1.0 is off. Raising it is tempting for the bank statements that run to the
    # token cap, but these pages legitimately repeat tokens — dates, EFTPOS,
    # amounts, column headers — so a penalty degrades exactly the transcription
    # it is meant to rescue. Change it only against a captured _truncated/ page
    # showing what is actually being repeated.
    repetition_penalty: 1.0
    vllm_engine: none

  # Spec §8.6. 4-bit QAT, so character-level slips here are a quantisation
  # signal rather than a convention one. Served from the remote GPU host.
  gemma-4-12B-it-qat-w4a16-ct:
    # In-process vLLM engine, not a served endpoint: the sandbox that holds this
    # checkpoint drives vLLM through its offline Python API, so there is no
    # OpenAI-compatible URL to call. Run this on the GPU host itself, in an env
    # with vLLM >= 0.23.0 (the floor for gemma4_unified).
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/gemma-4-12B-it-qat-w4a16-ct
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 600
    mlx_unused_towers: []
    image_first: true
    # Measured values from the LMM_POC sandbox, not guesses. Engine tuning
    # decides what the model can SEE, so a wrong value here produces a run that
    # completes and is quietly worse.
    vllm_engine:
      # 9.56 GiB of weights fits one L4 whole, so tp=1 — which also sidesteps
      # the tensor-parallel SHM deadlock that host records for PCIe-linked L4s.
      tensor_parallel_size: 1
      max_model_len: 16384
      gpu_memory_utilization: 0.90
      max_num_seqs: 10
      # One whole image; Gemma pan-and-scans internally.
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      # The vision budget, and the single most consequential value here. 1120
      # and 280 were BOTH measured on this checkpoint and both regressed
      # (median F1 0.953 -> 0.369 at 1120; 0.915 -> 0.882 at 280). 560 is the
      # value to beat, not a starting point. Written once and applied to both
      # mm_processor_kwargs.max_soft_tokens and
      # hf_overrides.vision_config.num_soft_tokens, which must agree — one
      # value makes disagreement unrepresentable rather than merely tested.
      soft_tokens: 560
      # This checkpoint's own tokenizer is correct; see InternVL below for the
      # case where it is not.
      tokenizer: none
    # See the note above: 1.0 is off, and this corpus is repetitive by nature.
    repetition_penalty: 1.0

  # Spec §8.6. A second VLM family rather than a second Gemma, because the pass
  # is looking for convention disagreement, not a leaderboard.
  InternVL3.5-8B:
    transport: vllm_offline
    model: /home/jovyan/nfs_share/models/InternVL3_5-8B
    base_url: none
    base_url_env: none
    api_key_env: none
    temperature: 0.0
    top_p: 1.0
    max_output_tokens: 8192
    timeout_seconds: 600
    mlx_unused_towers: []
    image_first: true
    repetition_penalty: 1.0
    vllm_engine:
      tensor_parallel_size: 1
      max_model_len: 16384
      gpu_memory_utilization: 0.90
      max_num_seqs: 10
      # One whole image. The LMM_POC sandbox sets 19 because its pipeline
      # PRE-TILES: it crops the page into 18 tiles plus a thumbnail and hands
      # vLLM each as a separate image, so the limit must admit them all. This
      # runner sends the page whole and lets InternVL tile it internally, which
      # vLLM counts as one image. If dense statements read poorly, pre-tiling is
      # the first thing to try — it is why that sandbox does it.
      limit_mm_images: 1
      enable_prefix_caching: true
      enforce_eager: false
      # A gemma4_unified knob; this architecture has no equivalent.
      soft_tokens: none
      # REQUIRED for this checkpoint, and not a tuning choice. InternVL3.5 ships
      # a Mistral tokenizer whose pre-tokenizer regex mis-splits runs of
      # whitespace and digits — which is exactly what a whitespace-aligned,
      # digit-heavy bank statement is made of, so it corrupts amount
      # tokenization. vLLM exposes no flag for it and loads the tokenizer in the
      # front-end AND in every spawned EngineCore child, so a load-time patch
      # cannot reach the children; the fix has to be a corrected copy on disk.
      #
      # Produce it with LMM_POC's ensure_corrected_tokenizer(), which writes a
      # fix_mistral_regex-corrected copy to
      # ~/.cache/lmm_poc_tokenizers/<model-name>, then point this at it.
      # Running without it scores a tokenizer bug as the model misreading, on
      # the amount columns this corpus is largely made of.
      tokenizer: /home/jovyan/.cache/lmm_poc_tokenizers/InternVL3_5-8B
