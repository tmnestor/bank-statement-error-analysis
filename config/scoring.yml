# How a prediction and a transcript are normalised before the primary metric.
# This file is the whole normalisation policy: reading it should answer what
# scoring does without consulting Python. Every key is required — the loader
# fails fast on any omission, including the key whose value is a no-op.
#
# Normalisation lives here, and never in the generator: the corpus emits one
# canonical form and never normalises, so scoring policy can change without
# regenerating a single image (corpus design §5).

# Unicode normalisation form, applied first.
unicode_form: NFKC

# En/em/figure dashes and curly quotes fold to their ASCII equivalents. This is
# folding, not stripping: the characters become ASCII, they do not disappear.
fold_dashes: true
fold_quotes: true

# Markdown structure is removed positionally, never as a character blacklist.
# A blacklist would corrupt real content in this corpus — the hyphen in
# "01/09/2023 - 23/09/2023" and in "5-7 business days", the Westpac "Credits (-)"
# column header — and would score a model down for reading them correctly.
# So: emphasis is a matched pair of delimiters, a heading mark is a hash run
# followed by whitespace at the start of a line (leaving the receipt number
# "#R-011FDD" alone), a table mark is a cell pipe or a separator row.
strip_emphasis: true
strip_heading_marks: true
strip_table_marks: true
strip_blockquote_marks: true

# A table is the one structure competent parsers render in two different
# dialects: the corpus emits a pipe table, MinerU emits <table><tr><td> — on
# 110 of 165 pages, including every bank statement. Both state the same cells,
# so leaving the HTML in place scored a correctly-read table as thousands of
# character errors and filed pure dialect under "reading error", which is
# exactly the misdiagnosis the §8.6 calibration pass exists to catch.
#
# Stripping stays positional: the pattern matches named elements of the table
# family only (table/thead/tbody/tfoot/caption/colgroup/col/tr/td/th), opening
# or closing, with or without attributes. A bare "<" in content has no tag name
# after it and survives; a non-table tag stays visible rather than being
# silently swallowed.
#
# Set this false to measure dialect adherence rather than reading — the strict
# metric already does that, since it normalises nothing.
strip_html_table_marks: true

# `&amp;` is the same character the page prints, spelled the way HTML spells
# it. Both parsers emit it (55 occurrences), so scoring it as a misread
# ampersand measures output format, not reading. Applied as decoding, before
# anything inspects the characters, and symmetric: a page that really prints
# "&" and a prediction that writes "&amp;" agree after this, while a prediction
# that drops the character entirely still diverges.
unescape_html_entities: true

# A colon at a token boundary is a label separator, and both parsers drop it
# after a table-cell label — "GST:" -> "GST", "SUBTOTAL:" -> "SUBTOTAL",
# "TOTAL:" -> "TOTAL", 170 occurrences across both. Two independent parsers
# agreeing is the §8.6 signal that the colon is house style rather than
# something a reader is failing to see.
#
# The boundary is what keeps this safe: a colon with non-space on both sides is
# content and survives — the time "15:46", the ratio "1:1". Only a colon
# followed by whitespace or end of text is folded.
#
# Consequence to accept knowingly: the normalised metric can no longer tell a
# prediction that keeps the pair separator from one that drops it. That is the
# same trade the table keys make, and the strict metric still measures it.
fold_trailing_colons: true

# All whitespace runs become one space, and both ends are trimmed. This is what
# makes the primary metric blind to wrapping.
collapse_whitespace: true

# Deliberately false, and present rather than absent so the file states the
# decision instead of leaving it to be inferred from silence. Reading account
# names and identifiers with correct case is legitimately part of transcription
# (corpus design §5).
fold_case: false
